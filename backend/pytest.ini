[pytest]
# Pytest configuration for Deepfake Detector Backend

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts = -v --tb=short --strict-markers

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Async mode
asyncio_mode = auto
